<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#f43f5e" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Globe Body -->
  <g transform="translate(4, 4) scale(0.9)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Globe Outer Circle (clipped by X in top right) -->
    <circle cx="30" cy="34" r="19" stroke="url(#globeGrad)" stroke-width="3" fill="none" opacity="0.9"/>
    
    <!-- Equator -->
    <line x1="11" y1="34" x2="49" y2="34" stroke="url(#globeGrad)" stroke-width="2.5" opacity="0.8"/>
    
    <!-- Longitudes -->
    <ellipse cx="30" cy="34" rx="9" ry="19" stroke="url(#globeGrad)" stroke-width="2.5" fill="none" opacity="0.8"/>

    <!-- Disconnect / X Mark with vibrant glow -->
    <g filter="url(#glow)">
      <circle cx="46" cy="18" r="10" fill="#09090b" stroke="#f43f5e" stroke-width="2"/>
      <path d="M42 14 L50 22 M50 14 L42 22" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>